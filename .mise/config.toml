# Developer tooling for the Lumière repo. mise provisions the toolchain and
# wraps common dev tasks; it is NOT required to *use* the binary.

[settings]
activate_aggressive = true
aqua.minisign = true
aqua.slsa = true
auto_install = true
disable_backends = ["asdf", "gen", "dotnet", "spm", "ubi", "bun"]
exec_auto_install = true
experimental = true
idiomatic_version_file_enable_tools = []
jobs = 8
lockfile = true
not_found_auto_install = true
npm = { package_manager = "aube" }
plugin_autoupdate_last_check_duration = "2d"
task.output = "keep-order"
use_versions_host = true

[tools]
rust = "latest"
"aqua:cli/cli" = "latest"
"npm:@openai/codex" = "latest"
"cargo:dioxus-cli" = "latest"
"cargo:cargo-deb" = "latest"

[tasks.build]
description = "Build the daemon and CLI (debug)"
run = "cargo build -p lumiere-daemon -p lumiere-cli"

[tasks.build-ui]
description = "Build the web UI bundle into dist/web"
run = "cargo xtask ui"

[tasks.lumi]
description = "Build everything and run the daemon on localhost:9091 (extra args pass through, e.g. mise run lumi -- --sim)"
depends = ["build", "build-ui"]
run = "./target/debug/lumiere-daemon --bind 127.0.0.1:9091"

[tasks.deb]
description = "Build the Debian package with the systemd unit"
depends = ["build-ui"]
run = "cargo deb -p lumiere-daemon"

[tasks.dist]
description = "Release archive: optimized UI embedded in a release daemon"
run = "cargo xtask dist"
