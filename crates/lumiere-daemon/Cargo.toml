[package]
name = "lumiere-daemon"
description = "The Lumière daemon: actors, persistence, HTTP/WS API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
embed-ui = []

[dependencies]
lumiere-proto.workspace = true
lumiere-core.workspace = true
lumiere-transport.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
axum.workspace = true
tower-http.workspace = true
directories.workspace = true
getrandom.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path", "mime-guess", "include-exclude"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", features = ["json"] }
