[package]
name = "lumiere-transport"
description = "Transport/Link traits, btleplug backend, and the light simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["btleplug"]
btleplug = ["dep:btleplug", "dep:dbus"]

[dependencies]
lumiere-proto.workspace = true
lumiere-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
btleplug = { version = "0.12", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
