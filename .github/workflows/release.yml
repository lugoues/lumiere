name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI
        run: cargo binstall --no-confirm dioxus-cli
      - name: Build web UI
        working-directory: crates/lumiere-ui
        run: dx build --platform web --release
      - name: Collect web UI
        run: |
          mkdir -p dist/web
          cp -R target/dx/lumiere-ui/release/web/public/. dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web

  build:
    needs: ui
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist/web
      # lumiere-transport enables dbus's vendored feature, so Linux needs no
      # system libdbus development package.
      - name: Build binaries
        run: |
          cargo build --release --target "${{ matrix.target }}" --features embed-ui -p lumiere-daemon
          cargo build --release --target "${{ matrix.target }}" -p lumiere-cli
      - name: Package binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp README.md "target/${{ matrix.target }}/release/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="lumiere-${version}-${{ matrix.target }}.zip"
            (cd "target/${{ matrix.target }}/release" && 7z a "${GITHUB_WORKSPACE}/${archive}" lumiere-daemon.exe lumiere.exe README.md)
          else
            archive="lumiere-${version}-${{ matrix.target }}.tar.gz"
            tar -czf "${archive}" -C "target/${{ matrix.target }}/release" lumiere-daemon lumiere README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            lumiere-*.tar.gz
            lumiere-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      # Keyless sigstore provenance for every artifact. Verify with:
      #   gh attestation verify <file> --repo lugoues/lumiere
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
      - name: Render Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release-artifacts/lumiere-${version}-aarch64-apple-darwin.tar.gz"
          sha="$(sha256sum "${archive}" | cut -d' ' -f1)"
          sed -e "s/VERSION/${version}/g" -e "s/SHA256/${sha}/g" \
            packaging/homebrew/lumiere.rb > release-artifacts/lumiere.rb
          grep -q "download/v${version}/lumiere-${version}-" release-artifacts/lumiere.rb
      - name: Render scoop manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release-artifacts/lumiere-${version}-x86_64-pc-windows-msvc.zip"
          sha="$(sha256sum "${archive}" | cut -d' ' -f1)"
          sed -e "s/VERSION/${version}/g" -e "s/SHA256/${sha}/g" \
            packaging/scoop/lumiere.json > release-artifacts/lumiere.json
          python3 -m json.tool release-artifacts/lumiere.json > /dev/null
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/lumiere.rb
            release-artifacts/lumiere.json
      # Pushes the rendered formula into the tap. Needs the TAP_GITHUB_TOKEN
      # secret: a fine-grained PAT with contents read/write on
      # lugoues/homebrew-tap. Skipped quietly when the secret is absent.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping tap update"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lugoues/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp release-artifacts/lumiere.rb tap/Formula/lumiere.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lumiere.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "lumiere ${GITHUB_REF_NAME}"
          git push
      # Same pattern for the scoop bucket: SCOOP_GITHUB_TOKEN is a fine-grained
      # PAT with contents read/write on lugoues/scoop-bucket. Skipped when absent.
      - name: Update scoop bucket
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
        run: |
          if [ -z "${BUCKET_TOKEN}" ]; then
            echo "SCOOP_GITHUB_TOKEN is not set; skipping bucket update"
            exit 0
          fi
          git clone "https://x-access-token:${BUCKET_TOKEN}@github.com/lugoues/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp release-artifacts/lumiere.json bucket/bucket/lumiere.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/lumiere.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -m "lumiere ${GITHUB_REF_NAME}"
          git push
