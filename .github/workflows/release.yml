name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI
        run: cargo binstall --no-confirm dioxus-cli
      - name: Build web UI
        working-directory: crates/lumiere-ui
        run: dx build --platform web --release
      - name: Collect web UI
        run: |
          mkdir -p dist/web
          cp -R target/dx/lumiere-ui/release/web/public/. dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web

  build:
    needs: ui
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist/web
      # lumiere-transport enables dbus's vendored feature, so Linux needs no
      # system libdbus development package.
      - name: Build binaries
        run: |
          cargo build --release --target "${{ matrix.target }}" --features embed-ui -p lumiere-daemon
          cargo build --release --target "${{ matrix.target }}" -p lumiere-cli
      - name: Package binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="lumiere-${version}-${{ matrix.target }}.tar.gz"
          cp README.md "target/${{ matrix.target }}/release/"
          tar -czf "${archive}" -C "target/${{ matrix.target }}/release" lumiere-daemon lumiere README.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: lumiere-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Render Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release-artifacts/lumiere-${version}-aarch64-apple-darwin.tar.gz"
          sha="$(sha256sum "${archive}" | cut -d' ' -f1)"
          sed -e "s/VERSION/${version}/g" -e "s/SHA256/${sha}/g" \
            packaging/homebrew/lumiere.rb > release-artifacts/lumiere.rb
          grep -q "download/v${version}/lumiere-${version}-" release-artifacts/lumiere.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/lumiere.rb
      # Pushes the rendered formula into the tap. Needs the TAP_GITHUB_TOKEN
      # secret: a fine-grained PAT with contents read/write on
      # lugoues/homebrew-tap. Skipped quietly when the secret is absent.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping tap update"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lugoues/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp release-artifacts/lumiere.rb tap/Formula/lumiere.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lumiere.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "lumiere ${GITHUB_REF_NAME}"
          git push
