[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lugoues/lumiere"

[workspace.dependencies]
lumiere-proto = { path = "crates/lumiere-proto" }
lumiere-core = { path = "crates/lumiere-core" }
lumiere-transport = { path = "crates/lumiere-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
toml = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "timeout", "trace"] }
directories = "6"
rand = "0.9"
subtle = "2"
tempfile = "3"

# Strips DWARF from release binaries. Precompiled std ships debug info that
# reaches the wasm and crashes dx's bundled wasm-opt (binaryen DWARFEmitter
# abort); stripping at link time removes it before wasm-opt ever runs.
[profile.release]
strip = "debuginfo"
